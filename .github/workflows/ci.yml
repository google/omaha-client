name: Cargo Checks, Build, Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check_build_test:
    name: Checks, Build, Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Install Rust
      run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }} && rustup component add rustfmt

    - name: Run rustfmt
      run: cargo fmt -- --check

    - name: Run clippy
      run: rustup component add clippy && cargo clippy -- -Dwarnings
      if: matrix.toolchain == 'nightly'

    - name: Build
      run: cargo build --verbose

    - name: Test
      run: cargo test --verbose

    - name: Test with Tokio
      run: cargo test --verbose --features tokio

    - name: Build examples
      run: cargo build --examples
